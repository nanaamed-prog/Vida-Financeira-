# Gera o APK Android. Só é preciso reinstalar o APK quando a pasta android/
# mudar (o conteúdo do app se atualiza sozinho pelo GitHub Pages).
name: Gerar APK Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # O runner ubuntu-latest já tem o Android SDK instalado (ANDROID_HOME)
      - name: Aceitar licenças do SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 ausente: o APK será assinado com chave de debug e NÃO poderá atualizar uma instalação feita com a chave oficial."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk VidaFinanceira.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VidaFinanceira-apk
          path: android/VidaFinanceira.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: Vida Financeira APK 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: android/VidaFinanceira.apk
          body: |
            APK do Vida Financeira (Android 5.0 ou superior).
            O conteúdo do app se atualiza sozinho; só reinstale quando houver uma nova versão deste APK.
