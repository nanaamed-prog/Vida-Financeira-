# Publica o app no GitHub Pages a cada atualização na branch main.
# O APK Android abre esse endereço, então as mudanças chegam ao celular
# automaticamente, sem reinstalar.
name: Publicar app (atualização automática)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build
        run: bunx vite build
        env:
          # Opcional: URL de um servidor com a IA Gemini (server.ts). Sem ela, usa o motor local.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
